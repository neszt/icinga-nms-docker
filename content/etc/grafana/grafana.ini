[server]
http_addr = 127.0.0.1
http_port = 3000
protocol = http
domain = localhost
root_url = %(protocol)s://%(domain)s/grafana/
serve_from_sub_path = true

[dashboards]
default_home_dashboard_path = /etc/grafana/dashboards/home.json

[auth]
disable_login_form = true

[auth.proxy]
enabled = true
header_name = X-WEBAUTH-USER
auto_sign_up = true

[users]
auto_assign_org_role = Viewer

[log]
mode = console