# Prometheus node exporter check definitions
define command{
        command_name    check_prometheus
        command_line    /usr/lib/nagios/plugins/check_http -H '$HOSTADDRESS$' -p '$ARG1$' -u /metrics -e 200
        }

define command{
        command_name    check_node_exporter
        command_line    /usr/lib/nagios/plugins/check_http -H '$HOSTADDRESS$' -p '$ARG1$' -u /metrics -e 200
        }