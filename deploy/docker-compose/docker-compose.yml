version: '3.3'
services:
  icinga-nms:
    hostname: icinga-nms
    restart: always
    image: neszt/icinga-nms-docker:$VERSION
    ports:
      - "$NMS_PORT:8080"
    environment:
      - NMS_URL=$NMS_URL
      - ICINGA_EXTINFO=$ICINGA_EXTINFO
      - ICINGA_FORCE_PING4=$ICINGA_FORCE_PING4
      - SMOKEPING_URL=$SMOKEPING_URL
      - MUNIN_URL=$MUNIN_URL
      - PROMETHEUS_ENABLED=${PROMETHEUS_ENABLED-yes}
      - GRAFANA_ENABLED=${GRAFANA_ENABLED-yes}
      - PROMETHEUS_EXPORTER_PORT=${PROMETHEUS_EXPORTER_PORT:-9100}
      - PROMETHEUS_RETENTION_TIME=${PROMETHEUS_RETENTION_TIME:-30d}
      - TIMEZONE=$TIMEZONE
      - GIT_CONFIG_STORE_SSH_URL=$GIT_CONFIG_STORE_SSH_URL
      - GIT_AUTOPULL_SCHEDULE=$GIT_AUTOPULL_SCHEDULE
      - SSH_RSA_KEY_BASE=$SSH_RSA_KEY_BASE
      - SSH_RSA_KEY_BASE_PUB=$SSH_RSA_KEY_BASE_PUB
      - SMS_TYPE=$SMS_TYPE
      - SMS_GW_URL=$SMS_GW_URL
      - SMS_GW_USER=$SMS_GW_USER
      - SMS_GW_APIKEY=$SMS_GW_APIKEY
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
      - ./data/config:/config
      - ./data/var/lib/icinga:/var/lib/icinga
      - ./data/var/log/icinga:/var/log/icinga
      - ./data/var/cache/icinga:/var/cache/icinga
      - ./data/var/lib/smokeping:/var/lib/smokeping
      - ./data/var/lib/munin:/var/lib/munin
      - ./data/var/lib/prometheus:/var/lib/prometheus
      - ./data/var/lib/grafana:/var/lib/grafana
      - ./data/var/log/grafana:/var/log/grafana
